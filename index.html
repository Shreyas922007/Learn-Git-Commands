<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample HTML Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #f5f7ff, #dfe9ff);
        color: #1f2937;
      }

      .container {
        max-width: 800px;
        margin: 80px auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        padding: 40px;
      }

      h1 {
        color: #2563eb;
        margin-bottom: 16px;
      }

      p {
        line-height: 1.7;
      }

      .button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, World!</h1>
      <p>
        This is a simple sample HTML page created in your project folder. You can
        edit the content, styles, and layout to build your own page.
      </p>
      <p>
        Use this as a starting point for web projects, practice exercises, or
        learning Git and HTML basics.
      </p>
      <a class="button" href="#">Learn More</a>
    </div>
    <a class="button" href="#">Learn More</a>
    <a class="button" href="#">Learn More</a>
  </body>
</html>
